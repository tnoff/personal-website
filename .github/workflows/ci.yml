name: CI

# Pull-request checks, ported from .gitlab-ci.yml's pr-check stage.

on:
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Scan for secrets
    uses: tnoff/github-workflows/.github/workflows/trufflehog.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f

  # Diff-scoped, not --all-files, and that is a correctness choice rather than a
  # speed one. The generate-resume hook is `pass_filenames: false` with
  # `files: Tyler_North_CV.yaml`, so under --all-files it fires on EVERY pull
  # request -- the CV is always in the set. GitLab ran
  # `--from-ref $CI_MERGE_REQUEST_DIFF_BASE_SHA --to-ref HEAD` for the same
  # reason. See github-workflows!36.
  #
  # No extra_packages: scripts/docker-generate.sh branches on `command -v
  # docker`, and a hosted runner HAS Docker, so the hook takes the container
  # path and Dockerfile.generate carries rendercv. That flips the branch the
  # script's own comment assumes ("CI's Kubernetes runner has no such daemon"),
  # which was true on GitLab and is not here. Verified against rootful Docker:
  # output byte-identical, working tree clean, existing files keep their
  # ownership because they are overwritten in place.
  #
  # fetch_depth stays at the workflow default of 0; the diff needs the base.
  pre-commit:
    name: pre-commit
    uses: tnoff/github-workflows/.github/workflows/pre-commit.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      all_files: false

  spellcheck:
    name: Spellcheck
    uses: tnoff/github-workflows/.github/workflows/spellcheck.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      name: html

  # Reimplements .image-build-rules' `changes:` block: only rebuild when
  # something baked into the image changed. Doc-only, renovate.json and
  # workflow-pin PRs skip the build, exactly as on GitLab.
  #
  # Done with git rather than a path-filter action to avoid another pinned
  # dependency for ~10 lines of shell. A workflow-level `paths:` filter would
  # be wrong: it would gate the secret scan and spellcheck too.
  changes:
    name: Detect image-input changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      image: ${{ steps.filter.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "${BASE_REF}"
          MATCH=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              Dockerfile|Dockerfile.generate|hugo-site/*)
                MATCH=true; break ;;
            esac
          done <<< "$(git diff --name-only "origin/${BASE_REF}...HEAD")"
          echo "image inputs changed: ${MATCH}"
          echo "image=${MATCH}" >> "$GITHUB_OUTPUT"

  # GitLab ran the build and the image scan as two jobs, shipping the image
  # between them as a tarball through an object-storage bucket.
  # docker-build-check does both in one job, so the bucket, the upload and the
  # download are gone.
  #
  # NOTE: conditional, so it must never be added to required_status_checks --
  # a required check that skips blocks the merge.
  build:
    name: Build and scan image
    needs: changes
    if: needs.changes.outputs.image == 'true'
    uses: tnoff/github-workflows/.github/workflows/docker-build-check.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f

  bump-version:
    name: Bump version
    if: startsWith(github.head_ref, 'renovate/dev-')
    permissions:
      contents: write
    uses: tnoff/github-workflows/.github/workflows/bump-version.yml@362a5f0d06fec04588c60863ccf0bf2ce709917f
    with:
      bump_changelog: true
    secrets:
      app_id: ${{ secrets.CI_APP_ID }}
      app_private_key: ${{ secrets.CI_APP_PRIVATE_KEY }}

  result:
    name: CI result
    # The stable name for the branch ruleset to require.
    #
    # Requiring the individual jobs by name does not gate anything: GitHub
    # scores a `skipped` required check as SUCCESS, and every shared workflow
    # here carries an `allow_fork_prs` gate that can skip its only job.
    #
    # The image build is conditional on `changes`, so it is `skipped` on a
    # PR that touches no image input -- correct, and why skipped passes below.
    # It is also why the build legs must never be required by name: they
    # would pass vacuously.
    #
    # This job always runs and its name never changes, so the ruleset requires
    # exactly one context and the jobs underneath stay free to change.
    if: always()
    needs: [secrets, pre-commit, spellcheck, changes, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Summarise
        run: |
          echo "secrets:    ${{ needs.secrets.result }}"
          echo "pre-commit: ${{ needs['pre-commit'].result }}"
          echo "spellcheck: ${{ needs.spellcheck.result }}"
          echo "changes:    ${{ needs.changes.result }}"
          echo "build:      ${{ needs.build.result }}"

      - name: Fail if any job failed
        # `skipped` is deliberately allowed: with allow_fork_prs false a fork
        # PR skips the cascade, which is the intended outcome, not a failure.
        if: >-
          needs.secrets.result == 'failure' || needs.secrets.result == 'cancelled' ||
          needs['pre-commit'].result == 'failure' || needs['pre-commit'].result == 'cancelled' ||
          needs.spellcheck.result == 'failure' || needs.spellcheck.result == 'cancelled' ||
          needs.changes.result == 'failure' || needs.changes.result == 'cancelled' ||
          needs.build.result == 'failure' || needs.build.result == 'cancelled'
        run: |
          echo "::error::One or more CI jobs did not pass."
          exit 1
