worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

# Load OpenTelemetry module
load_module modules/ngx_otel_module.so;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Trust X-Real-IP from ingress-nginx
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 10.244.0.0/16;
    real_ip_header X-Real-IP;

    # OpenTelemetry configuration
    otel_exporter {
        endpoint ${OTEL_EXPORTER_OTLP_ENDPOINT};
    }
    otel_service_name ${OTEL_SERVICE_NAME};
    otel_trace on;
    otel_trace_context inject;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    gzip on;

    server {
        listen ${PORT};
        server_name tyler-north.com;
        port_in_redirect off;
        root /usr/share/nginx/html;
        index index.html;

        # Enable gzip compression
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

        # Serve static files
        location / {
            otel_trace on;
            otel_trace_context inject;
            otel_span_attr http.client_ip $remote_addr;
            try_files $uri $uri/ =404;
        }

        # Health check endpoint
        location /_health/ {
            access_log off;
            # ...and no trace either. This is hit by the kubelet's readiness
            # and liveness probes and by nothing else — measured 2026-08-22 at
            # 0.28 spans/s against 0.0006 spans/s of real page views, so the
            # site's entire trace output was probes, each one its own
            # single-span trace. `otel_trace on` is inherited from the http
            # block, so it has to be turned off explicitly here.
            otel_trace off;
            return 200 "OK";
            add_header Content-Type text/plain;
        }

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
    }
}
