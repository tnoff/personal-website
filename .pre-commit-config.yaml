repos:
  - repo: https://github.com/PyCQA/bandit
    rev: '1.9.4'
    hooks:
      - id: bandit

  - repo: local
    hooks:
      - id: generate-resume
        name: Generate resume content from YAML
        entry: bash scripts/docker-generate.sh
        language: system
        files: Tyler_North_CV.yaml
        pass_filenames: false
