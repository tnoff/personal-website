# Backstage catalog descriptor. Discovered automatically -- the portal's GitHub
# provider reads catalog-info.yaml from the default branch of every repo the
# tnoff-backstage App can see, so this file is the whole of onboarding. Nothing
# needs registering by hand.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: personal-website
  description: >-
    Hugo static site for tyler-north.com, served by nginx with OpenTelemetry
    instrumentation. Content is generated from Tyler_North_CV.yaml by
    generate.py rather than authored as markdown by hand.
  annotations:
    # github, not gitlab. This repo is GitHub-canonical; the project spec's
    # annotation list predates the CI migration and still said
    # gitlab.com/project-slug.
    github.com/project-slug: tnoff/personal-website
    #
    # Deliberately absent, each for a checked reason rather than an oversight:
    #
    #   backstage.io/techdocs-ref
    #     There is no mkdocs.yml and no docs/ in this repo. The annotation is a
    #     claim that documentation exists at a path, so writing it now would
    #     advertise a Docs tab with nothing behind it. Arrives with TechDocs in
    #     phase 3, alongside the mkdocs.yml it points at.
    #
    #   backstage.io/kubernetes-label-selector
    #     `app=website` is NOT unique: docker-apps runs this Deployment and
    #     eastbay's under the same label, in different namespaces, and Backstage
    #     has no kubernetes-namespace annotation to disambiguate with (the only
    #     entity-side options are kubernetes-id and kubernetes-label-selector).
    #     A bare selector here would show eastbay's pods on this component and
    #     vice versa. The fix is backstage.io/kubernetes-id plus a matching
    #     label on both Deployments, which belongs in the change that installs
    #     the Kubernetes plugin.
    #
    #   grafana/dashboard-selector, grafana/alert-label-selector
    #     Nothing to select yet. There is no dashboard tagged for this service
    #     and no alert rule labelled with it -- monitoring/grafana/rules.yaml
    #     mentions personal-website only in a comment about alert thresholds.
spec:
  type: website
  owner: group:default/admin
  lifecycle: production
